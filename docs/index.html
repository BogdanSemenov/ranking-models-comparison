<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сравнение моделей ранжирования | A/B Test</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <h1>Сравнение моделей ранжирования</h1>
        <p class="subtitle">A/B тест товарных подборок</p>
    </header>

    <main class="container">
        <div class="comparison">
            <div class="model-column">
                <div class="model-header current">
                    <div class="model-label">
                        <span class="model-icon">A</span>
                        <div class="model-info">
                            <h2>Current Model</h2>
                            <span class="model-tag">Baseline</span>
                        </div>
                    </div>
                </div>
                <div class="category-header" id="current-category"></div>
                <div class="products-grid" id="current-products"></div>
            </div>

            <div class="divider">
                <div class="divider-line"></div>
                <span class="divider-text">VS</span>
                <div class="divider-line"></div>
            </div>

            <div class="model-column">
                <div class="model-header new">
                    <div class="model-label">
                        <span class="model-icon">B</span>
                        <div class="model-info">
                            <h2>New Model</h2>
                            <span class="model-tag challenger">Challenger</span>
                        </div>
                    </div>
                </div>
                <div class="category-header" id="new-category"></div>
                <div class="products-grid" id="new-products"></div>
            </div>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
