<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сравнение моделей ранжирования</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f5f5;
            color: #1a1a1a;
            line-height: 1.4;
        }

        /* Header */
        .header {
            background: #fff;
            border-bottom: 1px solid #e5e5e5;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 24px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            background: #e31837;
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 14px;
        }

        .search-box {
            flex: 1;
            max-width: 500px;
            display: flex;
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            overflow: hidden;
        }

        .search-box input {
            flex: 1;
            padding: 10px 16px;
            border: none;
            font-size: 14px;
            background: #fafafa;
        }

        .search-box button {
            background: #e31837;
            color: white;
            border: none;
            padding: 10px 20px;
            font-weight: 600;
            cursor: pointer;
        }

        .header-badge {
            background: #e8f4fd;
            color: #1a73e8;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
        }

        /* Main */
        .main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px;
        }

        .page-header {
            margin-bottom: 24px;
        }

        .page-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .page-subtitle {
            color: #666;
            font-size: 14px;
        }

        /* Model Tabs */
        .model-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        .model-tab {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 24px;
            background: #fff;
            border: 2px solid #e5e5e5;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .model-tab:hover {
            border-color: #ccc;
        }

        .model-tab.active {
            border-color: #e31837;
            background: #fff5f5;
        }

        .model-tab.active[data-model="new"] {
            border-color: #22c55e;
            background: #f0fdf4;
        }

        .tab-letter {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            color: white;
            background: #e31837;
        }

        .model-tab[data-model="new"] .tab-letter {
            background: #22c55e;
        }

        .tab-label {
            background: #fee2e2;
            color: #dc2626;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .model-tab[data-model="new"] .tab-label {
            background: #dcfce7;
            color: #16a34a;
        }

        /* Category */
        .category-header {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .product-count {
            font-size: 14px;
            color: #999;
            font-weight: 400;
        }

        /* Products Grid */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }

        @media (max-width: 1200px) {
            .products-grid { grid-template-columns: repeat(3, 1fr); }
        }

        @media (max-width: 900px) {
            .products-grid { grid-template-columns: repeat(2, 1fr); }
            .model-tabs { flex-direction: column; }
        }

        @media (max-width: 500px) {
            .main { padding: 16px; }
            .products-grid { gap: 12px; }
        }

        /* Product Card */
        .product-card {
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            height: 100%;
            border: 1px solid #f0f0f0;
            transition: box-shadow 0.2s;
        }

        .product-card:hover {
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
        }

        /* Image Container - Fixed aspect ratio */
        .product-image-container {
            position: relative;
            width: 100%;
            padding-top: 100%;
            background: #fff;
        }

        .product-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 16px;
        }

        /* Adtech badge - small, semi-transparent */
        .adtech-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            padding: 3px 6px;
            border-radius: 4px;
            font-size: 9px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Favorite */
        .favorite-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 32px;
            height: 32px;
            background: #fff;
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            cursor: pointer;
            color: #ccc;
            transition: color 0.2s;
        }

        .favorite-btn:hover {
            color: #e31837;
        }

        /* Product Info - Fixed height sections */
        .product-info {
            padding: 12px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        /* Price */
        .price-section {
            margin-bottom: 8px;
            min-height: 44px;
        }

        .price-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .price-current {
            font-size: 20px;
            font-weight: 700;
            color: #1a1a1a;
        }

        .price-current.has-sale {
            color: #e31837;
        }

        .price-currency {
            font-size: 16px;
        }

        .price-discount {
            background: #e31837;
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }

        .price-old {
            font-size: 13px;
            color: #999;
            text-decoration: line-through;
        }

        /* Name - Fixed height with ellipsis */
        .product-name {
            font-size: 13px;
            line-height: 1.4;
            color: #333;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            height: 36px;
            margin-bottom: 8px;
        }

        /* Rating */
        .rating {
            display: flex;
            align-items: center;
            gap: 4px;
            height: 20px;
            margin-bottom: 12px;
        }

        .rating-star {
            color: #fbbf24;
            font-size: 14px;
        }

        .rating-value {
            font-size: 13px;
            font-weight: 500;
            color: #333;
        }

        /* Cart button */
        .cart-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 10px;
            background: #fff;
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            color: #333;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: auto;
        }

        .cart-btn:hover {
            border-color: #e31837;
            color: #e31837;
        }

        .cart-btn svg {
            width: 18px;
            height: 18px;
        }

        /* Placeholder */
        .placeholder {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f9f9f9;
            color: #ddd;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">МАГНИТ</div>
        <div class="search-box">
            <input type="text" placeholder="Искать товары" disabled>
            <button>Найти</button>
        </div>
        <div class="header-badge">A/B Тест ранжирования</div>
    </header>

    <main class="main">
        <div class="page-header">
            <h1 class="page-title">Сравнение моделей ранжирования</h1>
            <p class="page-subtitle">Визуализация результатов A/B теста товарных подборок</p>
        </div>

        <div class="model-tabs">
            <button class="model-tab active" data-model="current">
                <span class="tab-letter">A</span>
                Current Model
                <span class="tab-label">Baseline</span>
            </button>
            <button class="model-tab" data-model="new">
                <span class="tab-letter">B</span>
                New Model
                <span class="tab-label">Challenger</span>
            </button>
        </div>

        <div class="category-header">
            <span id="category-name">Загрузка...</span>
            <span class="product-count" id="product-count"></span>
        </div>

        <div class="products-grid" id="products-grid">
            <div class="loading">Загрузка товаров...</div>
        </div>
    </main>

    <script>
        let currentProducts = [];
        let newProducts = [];
        let activeModel = 'current';

        function parseCSV(csv) {
            const lines = csv.trim().split('\n');
            const headers = lines[0].split(',').map(h => h.trim());
            const products = [];
            const seen = new Set();

            for (let i = 1; i < lines.length; i++) {
                const values = [];
                let current = '';
                let inQuotes = false;

                for (const char of lines[i]) {
                    if (char === '"') {
                        inQuotes = !inQuotes;
                    } else if (char === ',' && !inQuotes) {
                        values.push(current.trim());
                        current = '';
                    } else {
                        current += char;
                    }
                }
                values.push(current.trim());

                const obj = {};
                headers.forEach((h, idx) => obj[h] = values[idx] || '');

                if (!seen.has(obj.position)) {
                    seen.add(obj.position);
                    products.push(obj);
                }
            }
            return products;
        }

        function createCard(p) {
            const url = p.link || '#';
            const img = p.image || '';
            const isAdtech = p.is_adtech === 'True';
            const hasRating = p.rating_value && p.rating_value.trim() !== '';

            const basePrice = p.base_price ? Math.round(parseFloat(p.base_price)) : null;
            const salePrice = p.action_price ? Math.round(parseFloat(p.action_price)) : null;
            const hasSale = basePrice && salePrice && salePrice < basePrice;
            const discount = hasSale ? Math.round((1 - salePrice / basePrice) * 100) : 0;
            const displayPrice = salePrice || basePrice;
            const rating = hasRating ? (parseFloat(p.rating_value) % 1 === 0 ? parseInt(p.rating_value) : parseFloat(p.rating_value)) : null;

            return `
                <a href="${url}" target="_blank" class="product-card">
                    <div class="product-image-container">
                        ${isAdtech ? '<span class="adtech-badge">adtech</span>' : ''}
                        <button class="favorite-btn" onclick="event.preventDefault();event.stopPropagation();">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                            </svg>
                        </button>
                        ${img ? `<img src="${img}" alt="" class="product-image" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">` : ''}
                        <div class="placeholder" style="${img ? 'display:none' : ''}">
                            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
                                <rect x="3" y="3" width="18" height="18" rx="2"/>
                                <circle cx="8.5" cy="8.5" r="1.5"/>
                                <path d="M21 15l-5-5L5 21"/>
                            </svg>
                        </div>
                    </div>
                    <div class="product-info">
                        <div class="price-section">
                            ${displayPrice ? `
                                <div class="price-row">
                                    <span class="price-current${hasSale ? ' has-sale' : ''}">${displayPrice}<span class="price-currency">₽</span></span>
                                    ${hasSale ? `<span class="price-discount">-${discount}%</span>` : ''}
                                </div>
                                ${hasSale ? `<div class="price-old">${basePrice} ₽</div>` : ''}
                            ` : ''}
                        </div>
                        <div class="product-name">${p.product_name || ''}</div>
                        <div class="rating">
                            ${rating !== null ? `<span class="rating-star">★</span><span class="rating-value">${rating}</span>` : ''}
                        </div>
                        <button class="cart-btn" onclick="event.preventDefault();event.stopPropagation();">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
                                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
                            </svg>
                            В корзину
                        </button>
                    </div>
                </a>
            `;
        }

        function render(products) {
            const grid = document.getElementById('products-grid');
            const category = document.getElementById('category-name');
            const count = document.getElementById('product-count');

            if (products.length > 0) {
                category.textContent = products[0].art_category_level_2_name || 'Товары';
                count.textContent = `${products.length} товаров`;
                grid.innerHTML = products.map(createCard).join('');
            } else {
                grid.innerHTML = '<div class="loading">Нет товаров</div>';
            }
        }

        function switchModel(model) {
            activeModel = model;
            document.querySelectorAll('.model-tab').forEach(t => {
                t.classList.toggle('active', t.dataset.model === model);
            });
            render(model === 'current' ? currentProducts : newProducts);
        }

        async function init() {
            try {
                const [res1, res2] = await Promise.all([
                    fetch('data/current_model.csv'),
                    fetch('data/new_model.csv')
                ]);

                if (!res1.ok || !res2.ok) throw new Error('Failed to load CSV');

                currentProducts = parseCSV(await res1.text());
                newProducts = parseCSV(await res2.text());

                document.querySelectorAll('.model-tab').forEach(tab => {
                    tab.addEventListener('click', () => switchModel(tab.dataset.model));
                });

                render(currentProducts);
            } catch (e) {
                console.error(e);
                document.getElementById('products-grid').innerHTML = '<div class="loading">Ошибка загрузки данных</div>';
            }
        }

        init();
    </script>
</body>
</html>
