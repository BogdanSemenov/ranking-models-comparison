<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Магнит — Покупайте за 1₽</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            color: #1a1a1a;
        }

        /* Header */
        .header {
            background: #fff;
            border-bottom: 1px solid #e5e5e5;
        }

        .header-top {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px 24px;
            max-width: 1800px;
            margin: 0 auto;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-img {
            background: #e31837;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 13px;
        }

        .catalog-btn {
            background: #ffe5c4;
            color: #1a1a1a;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .search-box {
            flex: 1;
            max-width: 500px;
            display: flex;
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            overflow: hidden;
        }

        .search-box input {
            flex: 1;
            padding: 10px 16px;
            border: none;
            font-size: 14px;
            outline: none;
        }

        .search-box button {
            background: #e31837;
            color: white;
            border: none;
            padding: 10px 20px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
            font-size: 13px;
            color: #666;
        }

        .delivery-info {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Nav */
        .nav {
            background: #fff;
            border-bottom: 1px solid #e5e5e5;
            padding: 0 24px;
        }

        .nav-list {
            display: flex;
            gap: 24px;
            list-style: none;
            max-width: 1800px;
            margin: 0 auto;
        }

        .nav-list a {
            display: block;
            padding: 12px 0;
            color: #666;
            text-decoration: none;
            font-size: 13px;
        }

        .nav-list a:hover { color: #e31837; }

        /* Breadcrumbs */
        .breadcrumbs {
            padding: 12px 24px;
            font-size: 13px;
            color: #999;
            max-width: 1800px;
            margin: 0 auto;
        }

        .breadcrumbs a { color: #666; text-decoration: none; }
        .breadcrumbs a:hover { color: #e31837; }

        /* Main layout */
        .main {
            max-width: 1800px;
            margin: 0 auto;
            padding: 0 24px 40px;
        }

        .page-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 16px;
        }

        /* Comparison container */
        .comparison {
            display: flex;
            gap: 24px;
        }

        .model-section {
            flex: 1;
            min-width: 0;
        }

        .model-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            background: #fff;
            border-radius: 12px 12px 0 0;
            border-bottom: 3px solid #e31837;
        }

        .model-section:last-child .model-header {
            border-bottom-color: #22c55e;
        }

        .model-badge {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #e31837;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
        }

        .model-section:last-child .model-badge {
            background: #22c55e;
        }

        .model-title {
            font-size: 15px;
            font-weight: 600;
        }

        .model-tag {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            padding: 3px 8px;
            border-radius: 4px;
            background: #fee2e2;
            color: #dc2626;
        }

        .model-section:last-child .model-tag {
            background: #dcfce7;
            color: #16a34a;
        }

        /* Products grid */
        .products-container {
            background: #fff;
            border-radius: 0 0 12px 12px;
            padding: 16px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        /* Product card */
        .product-card {
            background: #fff;
            border-radius: 12px;
            border: 1px solid #f0f0f0;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            transition: box-shadow 0.2s;
        }

        .product-card:hover {
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
        }

        .product-image-wrap {
            position: relative;
            padding-top: 100%;
            background: #fff;
        }

        .product-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 12px;
        }

        .adtech-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(0,0,0,0.45);
            color: white;
            padding: 2px 5px;
            border-radius: 3px;
            font-size: 8px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .favorite-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 28px;
            height: 28px;
            background: #fff;
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            cursor: pointer;
            color: #ccc;
        }

        .favorite-btn:hover { color: #e31837; }

        .product-info {
            padding: 10px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .price-block { min-height: 40px; margin-bottom: 6px; }

        .price-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .price-main {
            font-size: 16px;
            font-weight: 700;
        }

        .price-main.sale { color: #e31837; }

        .price-discount {
            background: #e31837;
            color: white;
            padding: 1px 4px;
            border-radius: 3px;
            font-size: 10px;
            font-weight: 600;
        }

        .price-old {
            font-size: 12px;
            color: #999;
            text-decoration: line-through;
        }

        .product-name {
            font-size: 12px;
            line-height: 1.3;
            color: #333;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            height: 32px;
            margin-bottom: 6px;
        }

        .rating {
            display: flex;
            align-items: center;
            gap: 3px;
            height: 16px;
            margin-bottom: 8px;
            font-size: 11px;
        }

        .rating-star { color: #fbbf24; }
        .rating-value { color: #333; font-weight: 500; }

        .cart-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px;
            background: #fff;
            border: 1px solid #e5e5e5;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            margin-top: auto;
        }

        .cart-btn:hover { border-color: #e31837; color: #e31837; }
        .cart-btn svg { width: 14px; height: 14px; }

        .placeholder {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fafafa;
            color: #ddd;
        }

        .loading { text-align: center; padding: 40px; color: #999; font-size: 14px; }

        /* Responsive */
        @media (max-width: 1400px) {
            .comparison { flex-direction: column; }
        }

        @media (max-width: 900px) {
            .products-grid { grid-template-columns: repeat(2, 1fr); }
            .header-top { flex-wrap: wrap; }
            .nav-list { overflow-x: auto; }
        }

        @media (max-width: 600px) {
            .main { padding: 0 12px 24px; }
            .products-grid { gap: 8px; }
            .comparison { gap: 16px; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-top">
            <div class="logo">
                <span class="logo-img">МАГНИТ</span>
                <button class="catalog-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
                    </svg>
                    Каталог
                </button>
            </div>
            <div class="search-box">
                <input type="text" placeholder="Искать товары">
                <button>Найти</button>
            </div>
            <div class="header-right">
                <span class="delivery-info">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>
                    </svg>
                    Доставка • Магнит
                </span>
            </div>
        </div>
    </header>

    <nav class="nav">
        <ul class="nav-list">
            <li><a href="#">Карта Магнит Плюс</a></li>
            <li><a href="#">Акции</a></li>
            <li><a href="#">Магазины</a></li>
            <li><a href="#">Бонусы от партнёров</a></li>
            <li><a href="#">Помощь</a></li>
            <li><a href="#">Вакансии</a></li>
            <li><a href="#">Партнёрам</a></li>
            <li><a href="#">О компании</a></li>
        </ul>
    </nav>

    <div class="breadcrumbs">
        <a href="#">Главная</a> / <a href="#">Все категории</a> / <span id="breadcrumb-category">Покупайте за 1₽</span>
    </div>

    <main class="main">
        <h1 class="page-title" id="page-title">Покупайте за 1₽</h1>

        <div class="comparison">
            <div class="model-section">
                <div class="model-header">
                    <span class="model-badge">A</span>
                    <span class="model-title">Current Model</span>
                    <span class="model-tag">Baseline</span>
                </div>
                <div class="products-container">
                    <div class="products-grid" id="grid-current">
                        <div class="loading">Загрузка...</div>
                    </div>
                </div>
            </div>

            <div class="model-section">
                <div class="model-header">
                    <span class="model-badge">B</span>
                    <span class="model-title">New Model</span>
                    <span class="model-tag">Challenger</span>
                </div>
                <div class="products-container">
                    <div class="products-grid" id="grid-new">
                        <div class="loading">Загрузка...</div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        function parseCSV(csv) {
            const lines = csv.trim().split('\n');
            const headers = lines[0].split(',').map(h => h.trim());
            const products = [];
            const seen = new Set();

            for (let i = 1; i < lines.length; i++) {
                const values = [];
                let cur = '', inQ = false;
                for (const c of lines[i]) {
                    if (c === '"') inQ = !inQ;
                    else if (c === ',' && !inQ) { values.push(cur.trim()); cur = ''; }
                    else cur += c;
                }
                values.push(cur.trim());

                const obj = {};
                headers.forEach((h, idx) => obj[h] = values[idx] || '');

                if (!seen.has(obj.position)) {
                    seen.add(obj.position);
                    products.push(obj);
                }
            }
            return products;
        }

        function createCard(p) {
            const url = p.link || '#';
            const img = p.image || '';
            const isAd = p.is_adtech === 'True';
            const hasRating = p.rating_value && p.rating_value.trim();

            const base = p.base_price ? Math.round(parseFloat(p.base_price)) : null;
            const sale = p.action_price ? Math.round(parseFloat(p.action_price)) : null;
            const hasSale = base && sale && sale < base;
            const disc = hasSale ? Math.round((1 - sale / base) * 100) : 0;
            const price = sale || base;
            const rat = hasRating ? (parseFloat(p.rating_value) % 1 === 0 ? parseInt(p.rating_value) : parseFloat(p.rating_value).toFixed(1)) : null;

            return `
                <a href="${url}" target="_blank" class="product-card">
                    <div class="product-image-wrap">
                        ${isAd ? '<span class="adtech-badge">ad</span>' : ''}
                        <button class="favorite-btn" onclick="event.preventDefault();event.stopPropagation();">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
                                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                            </svg>
                        </button>
                        ${img ? `<img src="${img}" alt="" class="product-image" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">` : ''}
                        <div class="placeholder" style="${img ? 'display:none' : ''}">
                            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
                                <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>
                            </svg>
                        </div>
                    </div>
                    <div class="product-info">
                        <div class="price-block">
                            ${price ? `
                                <div class="price-row">
                                    <span class="price-main${hasSale ? ' sale' : ''}">${price}₽</span>
                                    ${hasSale ? `<span class="price-discount">-${disc}%</span>` : ''}
                                </div>
                                ${hasSale ? `<div class="price-old">${base} ₽</div>` : ''}
                            ` : ''}
                        </div>
                        <div class="product-name">${p.product_name || ''}</div>
                        <div class="rating">${rat !== null ? `<span class="rating-star">★</span><span class="rating-value">${rat}</span>` : ''}</div>
                        <button class="cart-btn" onclick="event.preventDefault();event.stopPropagation();">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
                                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
                            </svg>
                            В корзину
                        </button>
                    </div>
                </a>
            `;
        }

        function render(products, gridId) {
            const grid = document.getElementById(gridId);
            if (products.length > 0) {
                grid.innerHTML = products.map(createCard).join('');
            } else {
                grid.innerHTML = '<div class="loading">Нет товаров</div>';
            }
        }

        async function init() {
            try {
                const [r1, r2] = await Promise.all([
                    fetch('data/current_model.csv'),
                    fetch('data/new_model.csv')
                ]);

                if (!r1.ok || !r2.ok) throw new Error('CSV load failed');

                const current = parseCSV(await r1.text());
                const newP = parseCSV(await r2.text());

                if (current.length > 0) {
                    const cat = current[0].art_category_level_2_name || 'Покупайте за 1₽';
                    document.getElementById('page-title').textContent = cat;
                    document.getElementById('breadcrumb-category').textContent = cat;
                }

                render(current, 'grid-current');
                render(newP, 'grid-new');
            } catch (e) {
                console.error(e);
                document.getElementById('grid-current').innerHTML = '<div class="loading">Ошибка загрузки</div>';
                document.getElementById('grid-new').innerHTML = '<div class="loading">Ошибка загрузки</div>';
            }
        }

        init();
    </script>
</body>
</html>
